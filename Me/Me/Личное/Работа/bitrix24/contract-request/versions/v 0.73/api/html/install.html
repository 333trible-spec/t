<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Установка — Заявка на договор</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; color: #1f2937; }
    h1 { font-size: 22px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    code { font-size: 13px; word-break: break-all; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Заявка на договор — установка</h1>
  <p>Вкладка в карточке сделки: статус и задания БП <strong>608</strong> (CRM_DEAL).</p>
  <p>URL: <code id="base"></code></p>
  <p id="status">Инициализация BX24…</p>
  <ul id="log"></ul>
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <script>
    const TAB_TITLE = 'Заявка на договор';
    const PLACEMENT = 'CRM_DEAL_DETAIL_TAB';

    function publicBase() {
      return location.origin;
    }

    function handlerUrl(name) {
      return publicBase() + '/' + name;
    }

    function log(msg, ok) {
      const li = document.createElement('li');
      li.textContent = msg;
      if (ok === true) li.className = 'ok';
      if (ok === false) li.className = 'err';
      document.getElementById('log').appendChild(li);
    }

    function call(method, params) {
      return new Promise((resolve, reject) => {
        BX24.callMethod(method, params, (r) => {
          if (r.error()) reject(new Error(r.error_description || r.error()));
          else resolve(r.data());
        });
      });
    }

    async function bindPlacement(handler) {
      try {
        await call('placement.bind', {
          PLACEMENT,
          HANDLER: handler,
          TITLE: TAB_TITLE,
          DESCRIPTION: TAB_TITLE,
          LANG_ALL: { ru: { TITLE: TAB_TITLE, DESCRIPTION: TAB_TITLE } },
        });
        log(PLACEMENT + ' привязан', true);
      } catch (e) {
        const msg = e.message || '';
        if (/binded|bind/i.test(msg)) log(PLACEMENT + ' уже привязан', true);
        else throw e;
      }
    }

    document.getElementById('base').textContent = publicBase();

    BX24.init(async () => {
      const status = document.getElementById('status');
      try {
        await bindPlacement(handlerUrl('tab.html'));
        status.textContent = 'Готово. Откройте сделку → вкладка «' + TAB_TITLE + '».';
        log('Scope: crm + placement + bizproc + user', null);
        if (typeof BX24.installFinish === 'function') {
          BX24.installFinish();
        }
      } catch (e) {
        status.textContent = 'Ошибка установки';
        log(e.message || String(e), false);
        log('Проверьте scope и переустановите приложение', false);
      }
    }, () => {
      document.getElementById('status').textContent = 'Ошибка: нет связи с порталом';
      log('Откройте install.html из ik-navigator при установке приложения', false);
    });
  </script>
</body>
</html>
