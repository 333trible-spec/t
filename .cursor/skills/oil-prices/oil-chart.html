<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Нефть: Brent / Urals</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f1419;
      color: #e7ecf1;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: #9aa7b5; font-size: 13px; margin-bottom: 20px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: #1a222c;
      border: 1px solid #2a3542;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .stat .v { font-size: 24px; font-weight: 650; }
    .stat .l { color: #9aa7b5; font-size: 12px; margin-top: 4px; }
    .b { color: #5b9fd4; }
    .u { color: #d4a35b; }
    .s { color: #e06c75; }
    .chart-wrap {
      background: #1a222c;
      border: 1px solid #2a3542;
      border-radius: 8px;
      padding: 16px;
    }
    svg { width: 100%; height: auto; display: block; }
    .note { color: #9aa7b5; font-size: 12px; margin-top: 12px; line-height: 1.45; }
    .legend { display: flex; gap: 16px; margin-bottom: 10px; font-size: 13px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>
  <h1>Нефть: Brent и Urals</h1>
  <div class="sub">3 месяца · USD/баррель · 29.07.2026</div>
  <div class="stats">
    <div class="stat"><div class="v b">$87.24</div><div class="l">Brent</div></div>
    <div class="stat"><div class="v u">$71.90</div><div class="l">Urals (spot)</div></div>
    <div class="stat"><div class="v s">−$15.34</div><div class="l">Спред Urals − Brent</div></div>
  </div>
  <div class="chart-wrap">
    <div class="legend">
      <span><span class="dot" style="background:#5b9fd4"></span>Brent</span>
      <span><span class="dot" style="background:#d4a35b"></span>Urals (оценка)</span>
    </div>
    <svg id="c" viewBox="0 0 920 340" role="img" aria-label="График Brent и Urals"></svg>
    <div class="note">
      Brent: Yahoo BZ=F · Urals spot: Trading Economics (28.07) · ряд Urals = Brent − дисконт $15.34 (оценка)
    </div>
  </div>
  <script>
    const cats = ["29.04","01.05","05.05","07.05","11.05","13.05","15.05","19.05","21.05","26.05","28.05","01.06","03.06","05.06","09.06","11.06","15.06","17.06","22.06","24.06","26.06","30.06","02.07","07.07","09.07","13.07","15.07","17.07","21.07","23.07","27.07","29.07"];
    const brent = [118.03,108.17,109.87,100.06,104.21,105.63,109.26,111.28,102.58,99.58,93.71,94.98,97.81,93.09,91.45,90.38,83.17,79.55,77.9,73.74,71.99,72.92,71.8,74.16,76.3,83.3,84.95,88.1,91.01,100.69,88.36,87.24];
    const urals = [102.69,92.83,94.53,84.72,88.87,90.29,93.92,95.94,87.24,84.24,78.37,79.64,82.47,77.75,76.11,75.04,67.83,64.21,62.56,58.4,56.65,57.58,56.46,58.82,60.96,67.96,69.61,72.76,75.67,85.35,73.02,71.9];
    const svg = document.getElementById("c");
    const W = 920, H = 340, pad = { t: 16, r: 24, b: 40, l: 48 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const all = brent.concat(urals);
    const ymin = Math.floor(Math.min(...all) / 5) * 5 - 5;
    const ymax = Math.ceil(Math.max(...all) / 5) * 5 + 5;
    const x = (i) => pad.l + (i / (cats.length - 1)) * pw;
    const y = (v) => pad.t + (1 - (v - ymin) / (ymax - ymin)) * ph;
    const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    let g = "";
    for (let v = ymin; v <= ymax; v += 10) {
      const yy = y(v);
      g += `<line x1="${pad.l}" y1="${yy}" x2="${W - pad.r}" y2="${yy}" stroke="#2a3542" stroke-width="1"/>`;
      g += `<text x="${pad.l - 8}" y="${yy + 4}" fill="#9aa7b5" font-size="11" text-anchor="end">${v}</text>`;
    }
    [0, 7, 15, 23, 31].forEach((i) => {
      if (i < cats.length) g += `<text x="${x(i)}" y="${H - 12}" fill="#9aa7b5" font-size="11" text-anchor="middle">${cats[i]}</text>`;
    });
    g += `<path d="${path(brent)}" fill="none" stroke="#5b9fd4" stroke-width="2.5"/>`;
    g += `<path d="${path(urals)}" fill="none" stroke="#d4a35b" stroke-width="2.5"/>`;
    svg.innerHTML = g;
  </script>
</body>
</html>
